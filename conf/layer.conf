# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "edf-ptest-coverage"
BBFILE_PATTERN_edf-ptest-coverage = "^${LAYERDIR}/"
BBFILE_PRIORITY_edf-ptest-coverage = "6"

LAYERDEPENDS_edf-ptest-coverage = "core"
LAYERSERIES_COMPAT_edf-ptest-coverage = "wrynose"


INHERIT_DISTRO:remove = "create-spdx"
